        overflow: hidden;

      #root { position: fixed; inset: 0; }
      /* O roteador embrulha as rotas nesta div; sem altura explícita o
         height:100% das telas filhas não resolve e o conteúdo vaza da janela. */
      .app-shell { height: 100%; }
      .game-root { position: relative; width: 100%; height: 100%; }
      .game-root .screen { position: relative; z-index: 2; width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .game-root .stage { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
      video#cam, canvas#capture { display: none; }
